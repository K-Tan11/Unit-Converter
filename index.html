<!DOCTYPE html>
<html>

    <head>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <div id="header-el">
            <h2>Metric/Imperial Unit Conversion</h2>
            <input id="number-el" type="text">
            <button id="button-el">Convert</button>
        </div>

        <div id="bottom">
            <div id="tab">
                <h3 id="title">Length (Meter/Feet)</h3>
                <p id="length-el"></p>
            </div>
            <div id="tab">
                <h3 id="title">Volume (Liters/Gallons)</h3>
                <p id="volume-el"></p>
            </div>
            <div id="tab">
                <h3 id="title">Mass (Kilograms/Pounds)</h3>
                <p id="mass-el"></p>
            </div>
        </div>

        <script src="index.js"></script>
    </body>

</html>
